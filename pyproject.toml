[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "networks-proj"
version = "0.1.0"
description = "Configurable multi-agent social-relations experiment runner"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NetworksProj contributors" }]
dependencies = []

[project.scripts]
networks-study = "networks_proj.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
